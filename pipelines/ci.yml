name: $(Date:yyyyMMdd)$(Rev:.r) # build number = artifact version (see lab 06)

trigger:
  branches:
    include: [main, release/*]
  paths:
    exclude: [docs/*, "*.md"]

schedules:
  - cron: "30 20 * * 1-5" # UTC → 02:00 IST, weekdays
    displayName: Nightly
    branches:
      include: [main]
    always: false # skip if nothing changed

parameters:
  - name: runSlowTests
    displayName: Run slow tests
    type: boolean
    default: false

variables:
  - group: az400-common # Part C
  - name: isMain
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

stages:
  - stage: Build
    jobs:
      - job: Test
        pool:
          vmImage: ubuntu-latest
        strategy:
          maxParallel: 2
          matrix:
            node22: { nodeVersion: "22.x" }
            node24: { nodeVersion: "24.x" }
        steps:
          - template: templates/node-test.yml
            parameters:
              nodeVersion: $(nodeVersion)
          - ${{ if eq(parameters.runSlowTests, true) }}:
              - script: echo "Running slow tests…" && sleep 20
                displayName: Slow tests (only when the runtime parameter is ticked)

      - job: Package
        dependsOn: Test
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/app
              cp -r src package.json $(Build.ArtifactStagingDirectory)/app/
              echo "##vso[task.setvariable variable=appVersion;isOutput=true]1.0.$(Build.BuildId)"
            name: meta
            displayName: Stage files and compute version
          - publish: $(Build.ArtifactStagingDirectory)/app
            artifact: app

  - stage: DeployDev
    dependsOn: Build
    condition: and(succeeded(), eq(variables.isMain, true))
    variables:
      appVersion: $[ stageDependencies.Build.Package.outputs['meta.appVersion'] ]
    jobs:
      - deployment: Dev
        pool:
          vmImage: ubuntu-latest
        environment: az400-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    ls $(Pipeline.Workspace)/app
                    echo "Deploying version $(appVersion) (greeting: $(greeting))"
