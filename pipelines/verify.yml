trigger: none
pool:
  vmImage: ubuntu-latest
steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: sc-az400-typo
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show --query "{sub:name, user:user.name, type:user.type}" -o table
        az group show -n rg-az400-shared --query name -o tsv
